name: YouTube Thumbnail Source Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-thumbnail-source-audit.yml"
      - "tools/youtube-thumbnail-audit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-thumbnail-source-audit
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory every public upload
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Inventory channel tabs without downloading videos
        run: python tools/youtube-thumbnail-audit/inventory.py

      - name: Upload inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-inventory
          path: artifacts/channel-inventory
          if-no-files-found: error
          retention-days: 14

  cdn-frame-probe:
    name: Verify YouTube auto-generated exact frames
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pillow

      - name: Probe numbered frame variants from YouTube's image CDN
        run: python tools/youtube-thumbnail-audit/probe_cdn_frames.py

      - name: Upload CDN frame probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-cdn-frame-probe
          path: artifacts/cdn-frame-probe
          if-no-files-found: error
          retention-days: 14

  browser-frame-probe:
    name: Verify real video-element frame capture
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Capture exact decoded video frames in a real browser
        run: python tools/youtube-thumbnail-audit/probe_browser_frames.py

      - name: Upload browser frame probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-browser-frame-probe
          path: artifacts/browser-frame-probe
          if-no-files-found: error
          retention-days: 14
