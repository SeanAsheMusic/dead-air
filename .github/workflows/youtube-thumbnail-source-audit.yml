name: YouTube Thumbnail Source Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-thumbnail-source-audit.yml"
      - "tools/youtube-thumbnail-audit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-thumbnail-source-audit
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory every public upload
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Inventory channel tabs without downloading videos
        run: python tools/youtube-thumbnail-audit/inventory.py

      - name: Upload inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-inventory
          path: artifacts/channel-inventory
          if-no-files-found: error
          retention-days: 14
