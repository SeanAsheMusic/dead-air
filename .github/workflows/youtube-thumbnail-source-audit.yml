name: YouTube Thumbnail Source Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-thumbnail-source-audit.yml"
      - "tools/youtube-thumbnail-audit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-thumbnail-source-audit
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory every public upload
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Inventory channel tabs without downloading videos
        run: python tools/youtube-thumbnail-audit/inventory.py

      - name: Upload inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-inventory
          path: artifacts/channel-inventory
          if-no-files-found: error
          retention-days: 14

  source-probe:
    name: Verify exact source-frame access
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install yt-dlp, EJS, impersonation, and PO-token provider
        run: |
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          yt-dlp --version
          node --version
          ffmpeg -version | head -n 1

      - name: Start local BotGuard PO-token provider
        run: |
          docker run --name bgutil-provider -d -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider
          sleep 8
          docker ps --filter name=bgutil-provider
          docker logs bgutil-provider || true

      - name: Probe one representative upload through anonymous client fallbacks
        run: python tools/youtube-thumbnail-audit/probe_source_access.py

      - name: Upload exact-frame probe and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-source-frame-probe
          path: artifacts/source-probe
          if-no-files-found: error
          retention-days: 14
