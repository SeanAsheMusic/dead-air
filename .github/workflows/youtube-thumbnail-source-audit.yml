name: YouTube Thumbnail Source Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/youtube-thumbnail-source-audit.yml"
      - "tools/youtube-thumbnail-audit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-thumbnail-source-audit
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory every public upload
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Inventory channel tabs without downloading videos
        run: python tools/youtube-thumbnail-audit/inventory.py

      - name: Upload inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-inventory
          path: artifacts/channel-inventory
          if-no-files-found: error
          retention-days: 14

  source-pack:
    name: Build exact-frame review pack for all 109 uploads
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pillow

      - name: Download verified channel inventory
        uses: actions/download-artifact@v4
        with:
          name: youtube-channel-inventory
          path: artifacts/channel-inventory

      - name: Download and label source-accurate frames for every upload
        run: python tools/youtube-thumbnail-audit/build_source_pack.py

      - name: Upload compact visual review boards and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-source-overviews
          path: |
            artifacts/youtube-source-pack/overview-longform
            artifacts/youtube-source-pack/overview-shorts
            artifacts/youtube-source-pack/manifest.json
            artifacts/youtube-source-pack/manifest.csv
            artifacts/youtube-source-pack/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact long-form source frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-source-longform
          path: artifacts/youtube-source-pack/longform
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact Shorts source frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-source-shorts
          path: artifacts/youtube-source-pack/shorts
          if-no-files-found: error
          retention-days: 14
